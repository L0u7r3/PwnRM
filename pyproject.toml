[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pwnrm"
version = "2.1.0"
description = "WinRM shell and Active Directory assessment toolkit"
readme = "README.md"
license = "MIT"
authors = [
    {name = "uziii2208"}
]
keywords = ["winrm", "activedirectory", "pentest", "redteam", "impacket"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
requires-python = ">=3.10,<3.15"
dependencies = [
    "impacket>=0.12.0,<0.14",
    "requests>=2.28.0,<3",
    "urllib3>=1.26.0,<3",
    "pyasn1>=0.4.8,<0.7",
    "pycryptodomex>=3.18.0,<4",
    "cryptography>=41.0.0,<51",
    "prompt-toolkit>=3.0.0,<4",
    "defusedxml>=0.7.1,<0.8",
    "pypsrp[credssp]>=0.9.1,<0.10",
    "pyspnego[kerberos]>=0.12.0,<0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "pip-audit>=2.7.0",
]

[project.scripts]
pwnrm = "pwnrm.cli:main"

[project.urls]
Homepage = "https://github.com/L0u7r3/PwnRM"
Repository = "https://github.com/L0u7r3/PwnRM"
Issues = "https://github.com/L0u7r3/PwnRM/issues"
Upstream = "https://github.com/uziii2208/PwnRM"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pwnrm*"]

[tool.setuptools.package-data]
pwnrm = ["resources/*.ps1"]
