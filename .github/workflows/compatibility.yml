name: Python Compatibility

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Kerberos build dependencies
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev pkg-config
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m pip check
      - name: Verify CLI and auth backends
        run: |
          pwnrm --help >/dev/null
          python -c "import gssapi, krb5, requests_credssp"
      - name: Run tests
        run: python -m pytest -q
